<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#161b22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TPC PDV</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Loading splash -->
<div id="loading">
  <div class="spinner"></div>
  <span style="color:var(--text-muted);font-size:.88rem">Carregando TPC PDV&hellip;</span>
</div>

<!-- Blocker: caixa fechado — contém o próprio formulário de abertura -->
<div id="blocker">
  <div id="blocker-caixa" class="card" style="width:100%;max-width:380px;margin:1rem">
    <div style="font-size:3rem;text-align:center;margin-bottom:.75rem">&#x1F3E7;</div>
    <h2 style="text-align:center;margin-bottom:.25rem">Caixa Fechado</h2>
    <p style="text-align:center;color:var(--text-muted);font-size:.88rem;margin-bottom:1.25rem">Informe o valor inicial para abrir o turno.</p>

    <div class="form-group" style="margin-bottom:.75rem">
      <label>Valor inicial no caixa (R$)</label>
      <input type="number" id="blocker-abertura" min="0" step="0.01" placeholder="0,00" class="input-money">
    </div>
    <div class="form-group hidden" id="blocker-grp-baixo" style="margin-bottom:.75rem">
      <label style="color:var(--yellow)">&#x26A0;&#xFE0F; Valor abaixo do fundo m&iacute;nimo (R$ 200). Justifique:</label>
      <textarea id="blocker-just-baixo" rows="2" placeholder="Motivo..."></textarea>
    </div>
    <div class="form-group hidden" id="blocker-grp-tarde" style="margin-bottom:.75rem">
      <label style="color:var(--yellow)">&#x1F550; Abertura fora do hor&aacute;rio. Justifique para auditoria:</label>
      <textarea id="blocker-just-tarde" rows="2" placeholder="Motivo da abertura tardia..."></textarea>
    </div>
    <button class="btn btn--primary btn--full" id="blocker-btn-abrir">Abrir Caixa</button>
  </div>
</div>

<!-- Modal overlay -->
<div id="modal" class="hidden">
  <div id="modal-body"></div>
</div>

<!-- Toast notification -->
<div id="toast" class="toast"></div>

<!-- Main app -->
<div id="app">

  <!-- Header -->
  <header class="app-header">
    <h1>&#x1F3AD; TPC PDV</h1>
    <div class="header-right">
      <div id="online-indicator" class="online-dot" title="Conex&atilde;o"></div>
      <div id="session-chip" class="session-chip">Caixa fechado</div>
    </div>
  </header>

  <!-- Panels -->
  <div class="panels">

    <!-- PDV -->
    <div id="panel-pdv" class="panel hidden">
      <div class="pdv-layout">
        <div class="pdv-products">
          <div class="search-bar">
            <input type="search" id="pdv-search" placeholder="Buscar produto...">
          </div>
          <div class="cat-tabs" id="cat-tabs"></div>
          <div class="products-grid" id="products-grid">
            <div class="empty-state">Carregando produtos...</div>
          </div>
        </div>
        <div class="pdv-cart" id="pdv-cart"></div>
      </div>
    </div>

    <!-- Caixa -->
    <div id="panel-caixa" class="panel hidden"></div>

    <!-- Reservas -->
    <div id="panel-reservas" class="panel hidden"></div>

    <!-- Estoque -->
    <div id="panel-estoque" class="panel hidden"></div>

    <!-- Historico -->
    <div id="panel-historico" class="panel hidden"></div>

  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <button class="nav-btn active" data-tab="pdv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      PDV
    </button>

    <button class="nav-btn" data-tab="caixa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
      </svg>
      Caixa
    </button>

    <button class="nav-btn" data-tab="reservas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Reservas
    </button>

    <button class="nav-btn" data-tab="estoque">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      Estoque
    </button>

    <button class="nav-btn" data-tab="historico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Historico
    </button>

  </nav>
</div>

<script type="module" src="js/app.js?v=2"></script>
</body>
</html>
